name: CI

# scripts/preflight.sh runs the same commands with the same arguments locally;
# a step added here is added there in the same commit.
#
# - test / clippy / doc on the default (file backend) and the full native
#   feature set (ffi, sdf), and on no default features (memory backend only)
# - alice-analytics and alice-crypto are plain registry dependencies, so the
#   `analytics` / `crypto` bridges build and test against the released crates
#   (both are in NATIVE_FEATURES). Only `python` is not built here (clippy
#   lints it, lib only)

on:
  push:
    # ci/**: the same checks on a branch before it is fast-forwarded to main
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

# on main each commit has a group of its own and a run there is never
# cancelled; a newer run cancels an older one only off main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  # full native feature set (everything but python), shared by test / clippy / doc
  NATIVE_FEATURES: "ffi,sdf,analytics,crypto"

# The token only reads the repository; a job that needs more raises it for
# that job alone, with the reason next to it
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # aarch64: macos-latest, ubuntu-24.04-arm / x86_64: ubuntu-latest, windows-latest
        os: [macos-latest, ubuntu-24.04-arm, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # the toolchain itself comes from rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (branch, default toolchain stable)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Each step fails when no test ran at all, and when the named oracle
      # binary did not run (a feature mismatch would skip it silently).
      # determinism_golden pins bit patterns whose expected digests are the
      # same on every OS and in every feature set, so it is named in each step.
      - name: Test (default = file backend)
        shell: bash
        run: scripts/run_tests.sh storage_backend_parity,law_single_source,legacy_segment_compat,residual_arithmetic,determinism_golden,crash_reopen_process,blob_format_pin,blob_merge_semantics,exact_series,segment_range_arith,get_reads_memtable,lossless_irregular_keys,sparse_steps_repro,query_group_by_interval,query_group_by_floor,float_edge_golden,float_environment=2,db_semantics_id,law_record_semantics,minmax_signed_zero_arch=4,residual_unpinned_store=5,verdict_record_semantics=3,bloom_fixed_hash=4,nonfinite_exact=5,residual_base_finite=3,previous_identifier_store=5,stamp_is_checked_id=3,identifier_history=2,wal_append_after_recovery=7,wal_recovery_crash=2,fsync_single_place=1,legacy_segment_values=2,segment_view_parity=2,segment_decode_alloc_bound=3 -- cargo test
      - name: Test (full native feature set)
        shell: bash
        run: scripts/run_tests.sh storage_backend_parity,law_single_source,legacy_segment_compat,residual_arithmetic,determinism_golden,crash_reopen_process,blob_format_pin,blob_merge_semantics,exact_series,segment_range_arith,get_reads_memtable,lossless_irregular_keys,sparse_steps_repro,query_group_by_interval,query_group_by_floor,analytics_metrics_exact,float_edge_golden,float_environment=2,db_semantics_id,law_record_semantics,minmax_signed_zero_arch=4,residual_unpinned_store=5,verdict_record_semantics=3,bloom_fixed_hash=4,nonfinite_exact=5,residual_base_finite=3,previous_identifier_store=5,stamp_is_checked_id=3,identifier_history=2,wal_append_after_recovery=7,wal_recovery_crash=2,fsync_single_place=1,legacy_segment_values=2,segment_view_parity=2,segment_decode_alloc_bound=3 -- cargo test --features "$NATIVE_FEATURES"
      - name: Test (no default features = memory backend only)
        shell: bash
        run: scripts/run_tests.sh storage_backend_parity,law_single_source,legacy_segment_compat,determinism_golden,exact_series,segment_range_arith,get_reads_memtable,lossless_irregular_keys,sparse_steps_repro,query_group_by_interval,query_group_by_floor,float_edge_golden,float_environment=2,db_semantics_id,law_record_semantics,minmax_signed_zero_arch=4,verdict_record_semantics=3 -- cargo test --no-default-features
      - name: Test (law store oracles, memory backend only)
        shell: bash
        run: scripts/run_tests.sh law_store -- cargo test --no-default-features --test law_store
      # ALICE-Law G3, syntax-tree pre-check (tools/no-outer-fneg-of-fma, byte-identical to
      # ALICE-LOL's, built with --locked): its own tests, then the check over src/ tests/
      # examples/ benches/ with the exact fma-call counts of
      # scripts/no-outer-fneg-of-fma-allowlist.toml (8, 4 of them in src/); the IR half is g3-ir.yml
      - name: No negated fma result (syntax tree, tests then check)
        shell: bash
        run: |
          cargo fmt --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml -- --check
          cargo test --quiet --locked --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml
          cargo run --quiet --locked --release --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml -- --root .
      - name: Example (law_store, file + memory backend)
        run: cargo run --example law_store
      # README / README_JP の ```rust block は src/lib.rs の cfg(doctest) で
      # doctest として取り込んでいる この step が無いと、README の使い方が
      # API の変更で compile できなくなっても誰も気付かない
      - name: Doctests (includes both READMEs)
        run: cargo test --doc
      - name: Benches compile
        run: cargo bench --no-run
      # the default, `crypto` and `analytics` feature sets resolve from the manifests alone
      # (a copy of the tracked tree placed with no sibling checkout next to it)
      - name: Git consumer (resolves with no sibling checkout)
        run: python scripts/test_git_consumer.py

  wasm:
    name: wasm32-unknown-unknown build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (branch, default toolchain stable)
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      # rust-toolchain.toml pins the toolchain cargo runs with; the action above
      # adds the target to `stable`, so add it to the pinned one as well
      - name: Ensure wasm32-unknown-unknown rust-std is installed
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Memory backend only: no fs2 / memmap2; getrandom uses its `js` backend
      - name: Build (no default features)
        run: cargo build --lib --target wasm32-unknown-unknown --no-default-features
      - name: Clippy (no default features, wasm32)
        run: cargo clippy --lib --target wasm32-unknown-unknown --no-default-features -- -W clippy::pedantic -D warnings

  clippy:
    name: Clippy (pedantic, -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # the release tags: scripts/id_move_check.py compares with the newest one
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (branch, default toolchain stable)
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy (default features, all targets, pedantic)
        run: cargo clippy --all-targets -- -W clippy::pedantic -D warnings
      - name: Clippy (full native feature set, all targets, pedantic)
        run: cargo clippy --features "$NATIVE_FEATURES" --all-targets -- -W clippy::pedantic -D warnings
      - name: Clippy (no default features, all targets, pedantic)
        run: cargo clippy --no-default-features --all-targets -- -W clippy::pedantic -D warnings
      # python is the one feature the sets above leave out; checking it does
      # not link, so the interpreter is not needed. Not pedantic: the binding's
      # pyo3 signatures trip pedantic lints, while the disallowed lists of
      # clippy.toml (G1 / G10) are on by default and denied by -D warnings
      - name: Clippy (python bindings, lib)
        run: cargo clippy --lib --features python -- -D warnings
      # the lists in clippy.toml only gate anything if clippy flags a call to
      # them: a throwaway crate with the same clippy.toml plants one banned call
      # per row of scripts/clippy_canary_calls.tsv (0 rows fail). The rows are
      # generated from clippy.toml, one per disallowed-methods / disallowed-types
      # entry; --check fails when the file has drifted from clippy.toml
      - name: Clippy canary data (generator tests)
        run: python3 scripts/test_gen_clippy_canary_calls.py
      - name: Clippy canary data (generated from clippy.toml, no drift)
        run: python3 scripts/gen_clippy_canary_calls.py --check
      - name: Clippy canary (tests)
        run: python3 scripts/test_clippy_canary.py
      - name: Clippy canary (every planted banned call is flagged)
        run: python3 scripts/clippy_canary.py
      # a ban on an external crate's function covers that one path: every
      # public function of each external module the list names (read from
      # rustdoc JSON of the version in Cargo.lock) must be banned or allowed
      # with a reason in scripts/clippy_external_allow.toml
      - name: Clippy external coverage (tests)
        run: python3 scripts/test_clippy_external_coverage.py
      - name: Clippy external coverage (every public function of a named module is banned or allowed)
        run: python3 scripts/clippy_external_coverage.py
      # G9: an identifier (DB_SEMANTICS_ID) moves only with a breaking version and with
      # both values named in CHANGELOG.md; the released value is read from the published
      # crate at the newest release tag (scripts/id_move_check.py, shared with the other
      # ALICE crates). A registry that cannot be read fails on main and warns on ci/
      # branches and PRs
      - name: Identifier moves (tests)
        run: python3 scripts/test_id_move_check.py
      - name: Identifier moves (the release compared with)
        id: id-base
        run: echo "crate=$(python3 scripts/id_move_check.py --print-base)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cargo/registry/cache/*/${{ steps.id-base.outputs.crate }}.crate
          key: id-move-${{ steps.id-base.outputs.crate }}
      - name: Identifier moves (against the published release)
        run: python3 scripts/id_move_check.py

  # The declared `rust-version` compiled with exactly that toolchain. Bump
  # `rust-version` in Cargo.toml and the version below in the same commit.
  # 1.86 is refused by dependencies that declare 1.87.
  msrv:
    name: MSRV (rust-version = 1.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@91c3abd82c08dd9739cd868596bc2f9e426bd28e # 1.87 (branch, installs 1.87.0)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # library only: the dev-dependencies follow their own MSRV
      - name: cargo check on MSRV (default + full native feature set + no default features)
        run: |
          cargo +1.87 check --lib
          cargo +1.87 check --lib --features "$NATIVE_FEATURES"
          cargo +1.87 check --lib --no-default-features

  feature-powerset:
    name: Feature powerset (cargo-hack, depth 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (branch, default toolchain stable)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-hack
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-hack
      - name: Powerset ({fs, ffi, sdf} depth 2)
        run: cargo hack check --lib --feature-powerset --depth 2 --exclude-features python

  doc:
    name: Doc (RUSTDOCFLAGS=-Dwarnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (branch, default toolchain stable)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo doc (no-deps, default features)
        run: cargo doc --lib --no-deps
        env:
          RUSTDOCFLAGS: "-Dwarnings"
      - name: cargo doc (no-deps, full native feature set)
        run: cargo doc --lib --no-deps --features "$NATIVE_FEATURES"
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  docs-lint:
    # run on every OS so a locale or path difference in the checker itself
    # shows up here rather than as a silent pass
    name: Docs lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # the online pin step compares with the commit before the push
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Docs lint (tests)
        run: python scripts/test_docs_lint.py
      - name: Docs lint (public documents, CHANGELOG structure)
        run: python scripts/docs_lint.py --check
      - name: Concurrency of every branch-triggered workflow (test, then check)
        run: |
          python scripts/test_workflow_concurrency.py
          python scripts/workflow_concurrency.py
      - name: Python package license == crate license
        run: python scripts/check_py_license.py
      # the zero-test guard shared with ALICE-Analytics / ALICE-Edge, on each
      # OS's own bash
      - name: run_tests.sh (tests)
        run: python scripts/test_run_tests.py
      # ALICE-Law G11 (c): the files shared with the other crates are the bytes ALICE-Law's
      # table records (table and checker fetched at .github/shared-files-pin, both SHA-256
      # pinned); a difference, an unlisted shared path or nothing compared fails
      - name: Shared files equal ALICE-Law's table
        shell: bash
        run: |
          python scripts/test_shared_files.py
          scripts/shared_files.sh
      - name: Entropy guard (tests)
        run: python scripts/test_entropy_guard.py
      - name: Entropy guard (no OS entropy / wall clock in production code)
        run: python scripts/entropy_guard.py
      # ALICE-Law G13: unspecified-order collections, threads, rayon / crossbeam in src/ and the
      # dependencies, each reviewed site listed with its line hashes and reason in
      # scripts/order_allowlist.toml (the clippy.toml bans are the type-resolved half)
      - name: Order guard (test, then check)
        run: |
          python scripts/test_order_guard.py
          python scripts/order_guard.py
      # G1, libm half: a direct libm dependency must come with the libm:: ban
      # in clippy.toml and scripts/libm_ban_check.py (0 manifests read fails)
      - name: libm dependency guard (test, then check)
        run: |
          python scripts/test_libm_dependency_guard.py
          python scripts/libm_dependency_guard.py
      # G14, build half: no fast-math-style flag or target-cpu=native in any place a
      # build flag comes from (.cargo/config*, Cargo.toml, build.rs, workflows,
      # make / shell / Python scripts); nothing read or no root Cargo.toml fails
      - name: Build configuration guard (test, then check)
        run: |
          python scripts/test_build_config_guard.py
          python scripts/build_config_guard.py
      # the dynamic half's parser on each OS (the check itself runs in release-profile.yml)
      - name: Effective rustc flags check (tests)
        run: python scripts/test_build_flags_check.py
      - name: Fuzz reach gate (tests)
        run: python scripts/test_fuzz_reach.py
      - name: Tracked binaries (tests)
        run: python scripts/test_tracked_binaries.py
      - name: No built binary is tracked (0 files read fails)
        run: python scripts/tracked_binaries.py
      # every ALICE dependency is taken by git at a pinned rev: the check asserts that no manifest
      # names a ../ALICE-* path (0 path deps, nothing to pin); preflight runs the same check
      - name: ALICE sibling check (tests)
        run: python scripts/test_alice_siblings_check.py
      - name: ALICE sibling check (no path dependency on a sibling)
        run: python scripts/alice_siblings_check.py
      # the tests of the shared package_integrity.py (the packaging run itself is dormant)
      - name: Package integrity (tests)
        run: python scripts/test_package_integrity.py
      # ALICE-Law G5: release-profile.yml requires the same test binaries as the test job
      - name: Release legs require the same binaries (test, then check)
        run: |
          python scripts/test_release_lists_check.py
          python scripts/release_lists_check.py
      # the preflight mirror of law-readme-block.yml (the check itself runs there, here its tests)
      - name: README ALICE-Law block preflight check (tests)
        run: python scripts/test_law_readme_block_check.py
      - name: changed_paths oracle (path filter decision, gate and trigger lint)
        run: python scripts/test_changed_paths.py
      - name: changed_paths sync (no on.push paths off main, pull_request paths = pattern file, 0 compared fails)
        run: python scripts/changed_paths.py sync
      # every remote action is pinned to a commit SHA with its tag as a
      # comment, every workflow sets top-level permissions, a job that grants
      # write says why (0 workflows or 0 `uses:` compared is red)
      - name: Workflow pins (tests)
        run: python scripts/test_workflow_pin_check.py
      - name: Workflow pins (SHA, permissions)
        run: python scripts/workflow_pin_check.py
      - name: Workflow pin update (tests, fake GitHub API)
        run: python scripts/test_workflow_pin_update.py
      # once per run, only the pins this change adds or edits: each is the
      # commit its `# <tag>` comment names (a tag resolves to it, a branch
      # contains it). Unchanged pins depend on the action repositories, not on
      # this one, and are checked weekly by pin-audit.yml instead
      - name: Workflow pins (online, new or changed pins)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/workflow_pin_check.py --online --base auto

  # The one feature `cargo hack` excludes (pyo3 extension-module needs the
  # interpreter at link time): build the wheel and run the README example as a
  # test, so the Python binding and its docs cannot rot unnoticed.
  python:
    name: Python (maturin build + README example test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (branch, default toolchain stable)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Install maturin and test dependencies
        run: python -m pip install --upgrade pip 'maturin>=1.5,<2.0' numpy pytest
      # features come from [tool.maturin] in pyproject.toml; the wheel version is
      # dynamic (from Cargo.toml), so this also proves version single-sourcing
      - name: Build the wheel (maturin)
        run: maturin build --out dist
      - name: Install the built wheel
        run: pip install dist/*.whl
      - name: Import smoke
        run: python -c "import alice_db; print('alice_db', alice_db.__version__, 'imported')"
      - name: Python tests (README example + lossless), fail on 0 tests
        run: |
          collected=$(python -m pytest python/tests --collect-only -q 2>/dev/null | grep -c '::')
          echo "collected ${collected} python test(s)"
          [ "${collected}" -gt 0 ] || { echo "no python tests collected"; exit 1; }
          python -m pytest python/tests -v

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (branch, default toolchain stable)
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  actionlint:
    name: actionlint (workflow YAML)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # reviewdog's github-check reporter posts the findings as a check run
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: reviewdog/action-actionlint@a8ac3eea598697a830f7d8e701fc9fcbfde88974 # v1.80.0
        with:
          fail_level: error
          reporter: github-check
