[package]
name = "alice-db"
version = "0.2.0-beta.1"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "Model-Based LSM-Tree Database powered by ALICE-Zip procedural generation"
repository = "https://github.com/ext-sakamoro/ALICE-DB"
keywords = ["database", "compression", "procedural", "time-series", "lsm-tree"]
categories = ["database", "compression"]

[lib]
name = "alice_db"
crate-type = ["cdylib", "rlib"]

[dependencies]
# ALICE-Zip core. 2026-09-13 publish 済 (v0.1.0 crates.io)、git dep → crates.io へ
# In-tree dev では workspace-level `[patch]` で path 優先切替可
alice_core = { package = "alice-zip", version = "0.3" }

# Zero-Copy Serialization (Phase 1)
rkyv = { version = "0.7", features = ["validation", "std"] }
memmap2 = "0.9"

# Legacy Serialization (for compatibility)
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Compression
lzma-rs = "0.3"

# Async channels (for future use)
crossbeam-channel = "0.5"

# SIMD Acceleration (Phase 3)
wide = "0.7"

# Python bindings
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
numpy = { version = "0.29", optional = true }
ndarray = { version = "0.16", optional = true }

# Async/Parallel
rayon = "1.10"
parking_lot = "0.12"

# ALICE-Analytics bridge (optional)
alice-analytics = { path = "../ALICE-Analytics", version = "0.1", optional = true }

# ALICE-Crypto bridge (optional)
alice-crypto = { path = "../ALICE-Crypto", version = "0.1", optional = true, default-features = false, features = ["std"] }

# Advisory file locking (cross-platform)
fs2 = "0.4"

# v0.2.0-alpha.2: blob WAL record checksum (fast, pure-Rust CRC32C).
crc32fast = "1.4"

# Utilities
log = "0.4"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.10"
rand = "0.8"

[features]
default = []
ffi = []  # C/C++/C# FFI bindings
python = ["pyo3", "numpy", "ndarray"]
analytics = ["alice-analytics"]  # ALICE-Analytics bridge (MetricPipeline → DB persistence)
crypto = ["dep:alice-crypto"]  # ALICE-Crypto encryption at rest
sdf = []  # SDF spatial data storage (Morton code indexing)

[[bench]]
name = "db_benchmark"
harness = false

[[bench]]
name = "main"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

# alice-zip 0.3.0 crates.io publish 済のため patch 不要 (2026-09-13、旧 git dep から移行)
