[package]
name = "alice-db"
version = "0.3.0-beta.1"
# alice-zip 0.4 (const fn Vec::len) が 1.87 を要求、CI msrv job で実 compile (canonical 罠 #27)
rust-version = "1.87"
edition = "2021"
license = "AGPL-3.0-or-later OR LicenseRef-Commercial"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "Model-Based LSM-Tree Database powered by ALICE-Zip procedural generation"
repository = "https://github.com/ext-sakamoro/ALICE-DB"
keywords = ["database", "compression", "procedural", "time-series", "lsm-tree"]
categories = ["database", "compression"]

[lib]
name = "alice_db"
crate-type = ["cdylib", "rlib"]

[dependencies]
# ALICE-Zip core. 2026-09-13 publish 済 (v0.1.0 crates.io)、git dep → crates.io へ
# In-tree dev では workspace-level `[patch]` で path 優先切替可
alice_core = { package = "alice-zip", version = "0.4" }

# Zero-Copy Serialization (Phase 1)
rkyv = { version = "0.7", features = ["validation", "std"] }
# File backend only (`fs` feature): zero-copy segment / blob SSTable reads
memmap2 = { version = "0.9", optional = true }

# Legacy Serialization (for compatibility)
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Compression
lzma-rs = "0.3"

# Async channels (for future use)
crossbeam-channel = "0.5"

# SIMD Acceleration (Phase 3)
wide = "0.7"

# Python bindings
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
numpy = { version = "0.29", optional = true }
ndarray = { version = "0.16", optional = true }

# Async/Parallel
rayon = "1.10"
parking_lot = "0.12"

# ALICE-Analytics bridge (optional)
alice-analytics = { path = "../ALICE-Analytics", version = "0.1", optional = true }

# ALICE-Crypto bridge (optional)
alice-crypto = { path = "../ALICE-Crypto", version = "0.1", optional = true, default-features = false, features = ["std"] }

# Advisory file locking (cross-platform, `fs` feature only)
fs2 = { version = "0.4", optional = true }

# v0.2.0-alpha.2: blob WAL record checksum (fast, pure-Rust CRC32C).
crc32fast = "1.4"

# Utilities
log = "0.4"

# alice-zip (std) pulls rand 0.8 -> getrandom 0.2, which has no entropy source on
# wasm32-unknown-unknown unless the `js` backend is selected. ALICE-DB never asks
# for OS randomness (Perlin generators are seeded ChaCha), so this only makes the
# crate build for the browser target; native targets are unaffected.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
# Segment metadata records its creation time; `std` has no clock on this target
js-sys = "0.3"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.10"
rand = "0.8"
# Enables the open-file audit for every test build of this crate (src/fs_audit.rs)
alice-db = { path = ".", default-features = false, features = ["open-file-audit"] }

[features]
# `fs`: file-backed storage (data_dir + WAL + mmap + advisory locks). Without it
# only the in-memory backend (`AliceDB::in_memory`) is available, which is what
# wasm32-unknown-unknown builds use.
default = ["fs"]
fs = ["dep:fs2", "dep:memmap2"]
ffi = ["fs"]  # C/C++/C# FFI bindings (path-based open)
python = ["pyo3", "numpy", "ndarray", "fs"]
analytics = ["alice-analytics", "fs"]  # ALICE-Analytics bridge (MetricPipeline → DB persistence)
crypto = ["dep:alice-crypto", "fs"]  # ALICE-Crypto encryption at rest
sdf = ["fs"]  # SDF spatial data storage (Morton code indexing, path-based open)
# Test-only: panic when the file backend renames over, deletes, or truncates a
# file in a way Windows refuses (see src/fs_audit.rs). Enabled for this crate's
# own tests by the self dev-dependency below; not for dependants
open-file-audit = []

[[bench]]
name = "db_benchmark"
harness = false
required-features = ["fs"]

[[bench]]
name = "main"
harness = false
required-features = ["fs"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
# panic = "abort" は撤去 (2026-09-17): FFI の catch_unwind (src/ffi.rs guard) は
# unwind でしか機能せず、abort だと host process ごと落ちる
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

# alice-zip は crates.io 版 (0.4.0、2026-09-15 bump) のため patch 不要 (2026-09-13 に旧 git dep から移行)
