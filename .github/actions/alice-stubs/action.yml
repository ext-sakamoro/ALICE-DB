name: 'ALICE-DB Optional Bridge Stubs'
description: |
  Create empty stub crates for ALICE-DB sibling path deps
  (alice-analytics / alice-crypto)

  Each stub declares a license so cargo-deny can evaluate it

  The version of each stub has to satisfy the requirement in Cargo.toml:
  cargo resolves a path dependency against its own version, so a stub left
  behind at an older version makes every job fail at the metadata step

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        # ALICE-Analytics stub (optional feature)
        mkdir -p "../ALICE-Analytics/src"
        cat > "../ALICE-Analytics/Cargo.toml" <<'TOML'
        [package]
        name = "alice-analytics"
        version = "0.2.0"
        edition = "2021"
        license = "MIT OR Apache-2.0"

        [features]
        default = ["std"]
        std = []

        [lib]
        path = "src/lib.rs"
        TOML
        : > "../ALICE-Analytics/src/lib.rs"

        # ALICE-Crypto stub (optional feature, std)
        mkdir -p "../ALICE-Crypto/src"
        cat > "../ALICE-Crypto/Cargo.toml" <<'TOML'
        [package]
        name = "alice-crypto"
        version = "0.1.0"
        edition = "2021"
        license = "MIT OR Apache-2.0"

        [features]
        default = []
        std = []

        [lib]
        path = "src/lib.rs"
        TOML
        : > "../ALICE-Crypto/src/lib.rs"

        # No alice-zip stub: it comes from crates.io, not a sibling path, so a
        # stub would be an empty crate nothing resolves against

        echo "Created stubs: alice-analytics / alice-crypto"
