name: CI

# scripts/preflight.sh runs the same commands with the same arguments locally;
# a step added here is added there in the same commit.
#
# - test / clippy / doc on the default (file backend) and the full native
#   feature set (ffi, sdf), and on no default features (memory backend only)
# - alice-analytics and alice-crypto are plain registry dependencies, so the
#   `analytics` / `crypto` bridges build and test against the released crates
#   (both are in NATIVE_FEATURES). Only `python` is not built here

on:
  push:
    # ci/**: the same checks on a branch before it is fast-forwarded to main
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  # full native feature set (everything but python), shared by test / clippy / doc
  NATIVE_FEATURES: "ffi,sdf,analytics,crypto"

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # aarch64: macos-latest, ubuntu-24.04-arm / x86_64: ubuntu-latest, windows-latest
        os: [macos-latest, ubuntu-24.04-arm, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # the toolchain itself comes from rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Each step fails when no test ran at all, and when the named oracle
      # binary did not run (a feature mismatch would skip it silently).
      # determinism_golden pins bit patterns whose expected digests are the
      # same on every OS and in every feature set, so it is named in each step.
      - name: Test (default = file backend)
        shell: bash
        run: scripts/run_tests.sh storage_backend_parity,law_single_source,legacy_segment_compat,determinism_golden,crash_reopen_process,blob_format_pin,blob_merge_semantics,exact_series,segment_range_arith,get_reads_memtable,lossless_irregular_keys,sparse_steps_repro,query_group_by_interval,query_group_by_floor -- cargo test
      - name: Test (full native feature set)
        shell: bash
        run: scripts/run_tests.sh storage_backend_parity,law_single_source,legacy_segment_compat,determinism_golden,crash_reopen_process,blob_format_pin,blob_merge_semantics,exact_series,segment_range_arith,get_reads_memtable,lossless_irregular_keys,sparse_steps_repro,query_group_by_interval,query_group_by_floor,analytics_metrics_exact -- cargo test --features "$NATIVE_FEATURES"
      - name: Test (no default features = memory backend only)
        shell: bash
        run: scripts/run_tests.sh storage_backend_parity,law_single_source,legacy_segment_compat,determinism_golden,exact_series,segment_range_arith,get_reads_memtable,lossless_irregular_keys,sparse_steps_repro,query_group_by_interval,query_group_by_floor -- cargo test --no-default-features
      - name: Test (law store oracles, memory backend only)
        shell: bash
        run: scripts/run_tests.sh law_store -- cargo test --no-default-features --test law_store
      - name: Example (law_store, file + memory backend)
        run: cargo run --example law_store
      # README / README_JP の ```rust block は src/lib.rs の cfg(doctest) で
      # doctest として取り込んでいる この step が無いと、README の使い方が
      # API の変更で compile できなくなっても誰も気付かない
      - name: Doctests (includes both READMEs)
        run: cargo test --doc
      - name: Benches compile
        run: cargo bench --no-run

  wasm:
    name: wasm32-unknown-unknown build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      # rust-toolchain.toml pins the toolchain cargo runs with; the action above
      # adds the target to `stable`, so add it to the pinned one as well
      - name: Ensure wasm32-unknown-unknown rust-std is installed
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Memory backend only: no fs2 / memmap2; getrandom uses its `js` backend
      - name: Build (no default features)
        run: cargo build --lib --target wasm32-unknown-unknown --no-default-features
      - name: Clippy (no default features, wasm32)
        run: cargo clippy --lib --target wasm32-unknown-unknown --no-default-features -- -W clippy::pedantic -D warnings

  clippy:
    name: Clippy (pedantic, -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (default features, all targets, pedantic)
        run: cargo clippy --all-targets -- -W clippy::pedantic -D warnings
      - name: Clippy (full native feature set, all targets, pedantic)
        run: cargo clippy --features "$NATIVE_FEATURES" --all-targets -- -W clippy::pedantic -D warnings
      - name: Clippy (no default features, all targets, pedantic)
        run: cargo clippy --no-default-features --all-targets -- -W clippy::pedantic -D warnings

  # The declared `rust-version` compiled with exactly that toolchain. Bump
  # `rust-version` in Cargo.toml and the version below in the same commit.
  # 1.86 is refused by dependencies that declare 1.87.
  msrv:
    name: MSRV (rust-version = 1.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      # library only: the dev-dependencies follow their own MSRV
      - name: cargo check on MSRV (default + full native feature set + no default features)
        run: |
          cargo +1.87 check --lib
          cargo +1.87 check --lib --features "$NATIVE_FEATURES"
          cargo +1.87 check --lib --no-default-features

  feature-powerset:
    name: Feature powerset (cargo-hack, depth 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - name: Powerset ({fs, ffi, sdf} depth 2)
        run: cargo hack check --lib --feature-powerset --depth 2 --exclude-features python

  doc:
    name: Doc (RUSTDOCFLAGS=-Dwarnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc (no-deps, default features)
        run: cargo doc --lib --no-deps
        env:
          RUSTDOCFLAGS: "-Dwarnings"
      - name: cargo doc (no-deps, full native feature set)
        run: cargo doc --lib --no-deps --features "$NATIVE_FEATURES"
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  docs-lint:
    # run on every OS so a locale or path difference in the checker itself
    # shows up here rather than as a silent pass
    name: Docs lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Docs lint (tests)
        run: python scripts/test_docs_lint.py
      - name: Docs lint (public documents, CHANGELOG structure)
        run: python scripts/docs_lint.py --check
      - name: Fuzz reach gate (tests)
        run: python scripts/test_fuzz_reach.py

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  actionlint:
    name: actionlint (workflow YAML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
