name: Fuzz

# Time-boxed libFuzzer runs (cargo-fuzz, nightly): attacker-controlled bytes
# must not panic or exhaust memory.
#
# - fuzz_law_record: stored law records (law_store::decode_law_record), both as
#   given and wrapped in a valid checksum so the body parser is reached
# - fuzz_serialize_roundtrip: AliceDB::from_bytes on arbitrary bytes, and the
#   to_bytes -> from_bytes round trip of arbitrary points and blobs
# - fuzz_index_lookup: blob put / get / delete / prefix scan against a BTreeMap
# - fuzz_query_parse: the query builder with arbitrary ranges, aggregations,
#   group-by, limit and offset
#
# cargo-fuzz is installed with `cargo install`: the prebuilt binaries target
# musl, which the sanitizer build refuses.

on:
  push:
    # ci/**: the same checks on a branch before it is fast-forwarded to main
    branches: [main, 'ci/**']
    paths:
      - 'src/**'
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
  schedule:
    # 毎日 03:00 UTC = 12:00 JST (idle 時間帯)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Per-target fuzz duration (seconds)'
        required: false
        default: '60'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz — ${{ matrix.target }}
    runs-on: ubuntu-latest
    # build + a 60 s run normally take under 10 min
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_query_parse
          - fuzz_serialize_roundtrip
          - fuzz_index_lookup
          - fuzz_law_record
    steps:
      - uses: actions/checkout@v5

      # cargo-fuzz は nightly toolchain 必須
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # the build blocks: a compile error must not hide behind continue-on-error
      - name: Build fuzz target
        run: |
          cd fuzz
          cargo +nightly fuzz build "${{ matrix.target }}"

      - name: Set fuzz duration
        id: dur
        run: |
          DURATION="${{ github.event.inputs.duration_seconds }}"
          if [ -z "$DURATION" ]; then
            DURATION=60
          fi
          echo "seconds=$DURATION" >> "$GITHUB_OUTPUT"

      # A crash fails the job (it is a defect, not informational). Each target
      # must execute inputs and reach at least its coverage floor in
      # fuzz/coverage-floor.txt (scripts/fuzz_reach.py): a target that does not
      # call the crate, or stops at a checksum, covers far less. The
      # committed inputs in fuzz/regressions/<target> are replayed as an
      # extra corpus. The summary row is written even when the run crashed
      - name: Run fuzz target (time-boxed)
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          cd fuzz
          T="${{ matrix.target }}"
          extra=()
          if [ -d "regressions/$T" ]; then extra=("regressions/$T"); fi
          mkdir -p "corpus/$T"
          set +e
          cargo +nightly fuzz run "$T" "corpus/$T" "${extra[@]}" -- \
            -max_total_time=${{ steps.dur.outputs.seconds }} 2>&1 | tee fuzz-run.log
          rc=${PIPESTATUS[0]}
          set -e
          runs=$(grep -oE "Done [0-9]+ runs" fuzz-run.log | tail -1 | grep -oE "[0-9]+" || true)
          cov=$(grep -oE "DONE +cov: [0-9]+" fuzz-run.log | tail -1 | grep -oE "[0-9]+$" || true)
          status=ok
          if [ "$rc" -ne 0 ]; then status="crashed (exit $rc)"; fi
          echo "| $T | ${runs:-0} runs | cov ${cov:-?} | $status |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          python3 ../scripts/fuzz_reach.py "$T" fuzz-run.log coverage-floor.txt

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14
