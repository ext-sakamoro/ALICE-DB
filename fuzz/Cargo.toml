[package]
name = "alice-db-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
# fuzz_law_record wraps inputs in a valid checksum to reach the body parser
crc32fast = "1.4"
# fuzz_index_lookup: a fresh directory per input for the on-disk store
tempfile = "3"

[dependencies.alice-db]
path = ".."

# cargo-machete: libfuzzer-sys is referenced only inside the fuzz_target! macro
[package.metadata.cargo-machete]
ignored = ["libfuzzer-sys"]

# 攻撃者制御 byte 列を query 文字列として parse する経路 (public API 復活後に本体呼び出しへ差替え)
[[bin]]
name = "fuzz_query_parse"
path = "fuzz_targets/fuzz_query_parse.rs"
doc = false

# 攻撃者制御 byte 列で row serialize / deserialize round-trip が panic せず終端する
[[bin]]
name = "fuzz_serialize_roundtrip"
path = "fuzz_targets/fuzz_serialize_roundtrip.rs"
doc = false

# 攻撃者制御 index key で任意 key lookup が panic せず終端する
[[bin]]
name = "fuzz_index_lookup"
path = "fuzz_targets/fuzz_index_lookup.rs"
doc = false

# arbitrary bytes as a stored law record (law_store::decode_law_record)
[[bin]]
name = "fuzz_law_record"
path = "fuzz_targets/fuzz_law_record.rs"
doc = false

[workspace]
members = ["."]
