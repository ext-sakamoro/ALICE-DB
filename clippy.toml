# Determinism gate for everything this crate computes with floating point,
# plus (further down) a second gate against OS entropy and the wall clock.
#
# A segment stores a model, and reading it back means evaluating that model.
# A lossless segment additionally stores `original ^ model`, so the stored
# residual only reconstructs the original when the reader evaluates the model
# with the same arithmetic the writer used. IEEE 754 does not require the
# transcendentals to be correctly rounded, so the platform libm is free to
# differ between OS, CPU and compiler — which makes "the same model" too weak a
# condition to read data back exactly.
#
# The same holds for the arithmetic that decides what gets written: the size of
# a bloom filter (`bloom.rs`, serialised with the SSTable) and the fit error
# that picks a segment's model (`memtable.rs`). Two machines that size a filter
# or rank two candidate models differently write different files from the same
# input.
#
# The laws therefore come from `alice_core::generators` (point evaluators whose
# transcendentals are built from IEEE 754 basic operations only), the remaining
# transcendentals go through `alice-det-math` (the same arithmetic, identified
# by `alice_det_math::SEMANTICS_ID`), and a residual records the identifier of
# the arithmetic it was measured against. This gate keeps a local call to the
# platform version from coming back: without it, replacing the delegation with
# a hand-written `angle.sin()` passes every test on a machine whose libm
# happens to agree, and silently stops reconstructing data on one that does
# not. Measured here: the two agreed on 102,800 of 102,800 samples for a sine,
# which is exactly why a runtime oracle cannot be the gate.
#
# The list is the one alice-zip uses. CI runs clippy with
# `--all-targets ... -D warnings`, which turns `disallowed_methods` into a red
# gate for the library, the tests, the examples and the benches alike.
#
# Deliberately absent: `sqrt`, `floor`, `round`, `trunc`, `ceil` and `mul_add`.
# IEEE 754 specifies each of them exactly.
#
# Test fixtures that only need *some* varying signal, and oracles whose
# expected value must not come from the implementation under test, carry a
# scoped allow with the reason.
#
# Pinned by tests/determinism_golden.rs, which runs on every OS of the CI test
# matrix and in every feature set the test job builds.
