name: Release profile

# The whole test suite under the release profile (opt-level 3, no debug
# assertions): an optimisation that changes a stored or answered float (a
# contracted multiply-add, a reordered sum, a lost sign of zero) is red here
# even when the debug build in ci.yml is green. Mirrored in scripts/preflight.sh.
#
# No paths filter: every push to main runs it.

on:
  push:
    # ci/**: the same checks on a branch before it is fast-forwarded to main
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

# on main each commit has a group of its own and a run there is never
# cancelled; a newer run cancels an older one only off main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  # the full native feature set, as in ci.yml (the native leg below names it)
  NATIVE_FEATURES: "ffi,sdf,analytics,crypto"

# The token only reads the repository; a job that needs more raises it for
# that job alone, with the reason next to it
permissions:
  contents: read

jobs:
  release:
    name: Release suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # aarch64: macos-latest / x86_64: ubuntu-latest
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/alice-siblings
      # the toolchain itself comes from rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (branch, default toolchain stable)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # ALICE-Law G5: the whole suite under the release profile, every test leg of ci.yml's test
      # job with the same required binaries and counts (scripts/run_tests.sh fails when a
      # named binary ran fewer tests, and when no test ran); the float environment test (G14:
      # round-to-nearest-even, no flush-to-zero) is among them
      - name: Test (release, default)
        shell: bash
        run: scripts/run_tests.sh storage_backend_parity,law_single_source,legacy_segment_compat,residual_arithmetic,determinism_golden,crash_reopen_process,blob_format_pin,blob_merge_semantics,exact_series,segment_range_arith,get_reads_memtable,lossless_irregular_keys,sparse_steps_repro,query_group_by_interval,query_group_by_floor,float_edge_golden,float_environment=2,db_semantics_id,law_record_semantics,residual_unpinned_store=5,verdict_record_semantics=3,bloom_fixed_hash=4,nonfinite_exact=5,residual_base_finite=3,previous_identifier_store=4,stamp_is_checked_id=3 -- cargo test --release
      - name: Test (release, full native feature set)
        shell: bash
        run: scripts/run_tests.sh storage_backend_parity,law_single_source,legacy_segment_compat,residual_arithmetic,determinism_golden,crash_reopen_process,blob_format_pin,blob_merge_semantics,exact_series,segment_range_arith,get_reads_memtable,lossless_irregular_keys,sparse_steps_repro,query_group_by_interval,query_group_by_floor,analytics_metrics_exact,float_edge_golden,float_environment=2,db_semantics_id,law_record_semantics,residual_unpinned_store=5,verdict_record_semantics=3,bloom_fixed_hash=4,nonfinite_exact=5,residual_base_finite=3,previous_identifier_store=4,stamp_is_checked_id=3 -- cargo test --release --features "$NATIVE_FEATURES"
      - name: Test (release, no default features)
        shell: bash
        run: scripts/run_tests.sh storage_backend_parity,law_single_source,legacy_segment_compat,determinism_golden,exact_series,segment_range_arith,get_reads_memtable,lossless_irregular_keys,sparse_steps_repro,query_group_by_interval,query_group_by_floor,float_edge_golden,float_environment=2,db_semantics_id,law_record_semantics,verdict_record_semantics=3 -- cargo test --release --no-default-features
      - name: Test (release, law store oracles, memory backend)
        shell: bash
        run: scripts/run_tests.sh law_store -- cargo test --release --no-default-features --test law_store
      # G14, dynamic half: the flags cargo really passes to rustc, read from `-v` in a
      # fresh target directory (a reused one prints Fresh without the command line),
      # for the default, all-features and no-default feature sets; fails on a
      # native / fast-math / x87 flag, and when no command line for this crate was seen
      - name: Effective rustc flags (G14)
        shell: bash
        run: |
          python3 scripts/test_build_flags_check.py
          python3 scripts/build_flags_check.py -- cargo check --release --lib
          python3 scripts/build_flags_check.py -- cargo check --release --lib --all-features
          python3 scripts/build_flags_check.py -- cargo check --release --lib --no-default-features
