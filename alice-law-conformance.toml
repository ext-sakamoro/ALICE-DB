# ALICE-Law conformance manifest for this crate (alice-db). One entry per
# gate defined in ALICE-Law's conformance/gates.toml. Schema (status /
# evidence / mutant / note / reference_repo) is docs/CONFORMANCE.md's
# "Manifest" section in that repository.
#
# Written from what this repository's own tree, CI workflows and tests show,
# checked directly rather than assumed. A gate checked and unmet is
# `fail-known` (with the location), a gate not checked is `unverified`, and a
# `pass` names its evidence and the mutant that was run. File and line
# references are to the commit this manifest was written against.

[G1]
status = "fail-known"
evidence = ["clippy.toml", ".github/workflows/ci.yml"]
note = "unmet: (1) clippy.toml lists 24 of the 25 banned method names for both f32 and f64 plus powi, but not sin_cos (f32::sin_cos and f64::sin_cos are absent). Measured: `x.sin()` added to src/lib.rs fails `cargo clippy --lib -- -D warnings` with `use of a disallowed method f32::sin`, and `x.sin_cos()` in the same place passes (reverted). The library has no sin_cos call today. (2) the clippy jobs of .github/workflows/ci.yml (default, NATIVE_FEATURES = ffi,sdf,analytics,crypto, no-default-features, wasm32) never build the `python` feature, so the `mod python` block of src/lib.rs (line 722 on) is not linted; it contains no floating-point math today. (3) no canary test injects a banned call into a crate to show the lint still fires (see G11). powi is banned in clippy.toml (the G1 default), and the library does not call it. Transcendentals in test code (src/lib.rs:1100 and :1140, src/memtable.rs:730-755, src/ffi.rs:759) are lint-exempted test fixtures"
reference_repo = "ALICE-Zip"

