# cargo-deny 設定 (v0.14+ schema)
# https://embarkstudios.github.io/cargo-deny/
#
# canonical CI template: [[reference_alice_ci_canonical_template]]
# ALICE-SDF v1.7.7 (commit 52d26f9) の deny.toml を base に ALICE-DB 用に調整
#
# ALICE-DB 自体は MIT OR Apache-2.0 (permissive) のため自己 exception 不要
# sibling path dep は 0 (alice-stubs は no-op)

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories (RustSec CVE + yanked)
# ---------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
ignore = [
    # bincode 2.x unmaintained (postcard 移行コスト高)
    "RUSTSEC-2025-0141",
    # paste 1.0.15 unmaintained (pyo3-macros / bytemuck transitive)
    "RUSTSEC-2024-0436",
    # ttf-parser unmaintained (font 描画系 transitive、alice-db 直接無使用だが transitive 出現時 guard)
    "RUSTSEC-2026-0192",
    # proc-macro-error unmaintained (macro 系 transitive)
    "RUSTSEC-2024-0370",
    # instant unmaintained (時刻系 transitive)
    "RUSTSEC-2024-0384",
    # derivative unmaintained (macro 系 transitive)
    "RUSTSEC-2024-0388",
    # yaml-rust unmaintained (config 系 transitive)
    "RUSTSEC-2024-0320",
]

# ---------------------------------------------------------------------------
# Licenses (allow-list 方式)
# ---------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
    # Font-related licenses (transitive font-lib 経由)
    "OFL-1.1",           # SIL Open Font License (Ubuntu Mono / Noto 等)
    "Ubuntu-font-1.0",   # Ubuntu Font License
    # LLVM ecosystem
    "NCSA",              # libfuzzer-sys / LLVM related
    # Community Data License
    "CDLA-Permissive-2.0",
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "webpki"
version = "*"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

# ---------------------------------------------------------------------------
# Bans (banned crate / duplicate / wildcard)
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"   # path dep が wildcard version になるため必須
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
